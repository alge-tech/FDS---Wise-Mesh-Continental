# Hot-reload override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Vite dev server (bun) on 3010 and uvicorn --reload, both with bind mounts.
services:
  api:
    command: ["/app/entrypoint.sh", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations

  web:
    build: !reset null
    image: oven/bun:1.3.10
    working_dir: /app
    command: ["sh", "-c", "bun install && bun run dev --host 0.0.0.0 --port 3010"]
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports: !override
      - "3010:3010"

volumes:
  web_node_modules:
