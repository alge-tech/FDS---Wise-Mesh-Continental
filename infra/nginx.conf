# Wise Mesh web: serves the SvelteKit SPA build and proxies the API on the same origin.
# Installed as /etc/nginx/conf.d/default.conf in the frontend image (server block only).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads are capped at 5 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 6m;

    # Docker's embedded DNS. Resolving `api` per request lets nginx start before the API is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # --- API (same origin, so the httpOnly session cookie needs no CORS) -------------------
    location /v1/ {
        # A variable upstream with no URI part passes the original request URI unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the port (localhost:3010) so the API's Origin check matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Cookie and Set-Cookie pass through untouched (nginx forwards both by default).
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    location = /healthz {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets ---------------------------------------------------------------------
    # Hashed build output never changes: cache for a year.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The SPA shell must always be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /_app/version.json {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: any unknown path renders index.html and the client router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
