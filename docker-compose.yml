# Wise Mesh Continental — local stack. App: http://localhost:3010
# API docs: http://localhost:3011/docs · Postgres: localhost:5434
name: wise-mesh

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-mesh}
      POSTGRES_DB: mesh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-mesh_app}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d mesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mesh_app:${APP_DB_PASSWORD:-mesh_app}@db:5432/mesh
      MIGRATION_DATABASE_URL: postgresql+psycopg://mesh:${DB_OWNER_PASSWORD:-mesh}@db:5432/mesh
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      DEMO_MODE: ${DEMO_MODE:-true}
      NETTING_TIME_BUDGET_MS: ${NETTING_TIME_BUDGET_MS:-2000}
      MAX_RECOMPUTES: ${MAX_RECOMPUTES:-2}
      STANDARD_RATE_BPS: ${STANDARD_RATE_BPS:-52}
      FEE_SHARE_BPS: ${FEE_SHARE_BPS:-2500}
      DUST_THRESHOLD_MINOR: ${DUST_THRESHOLD_MINOR:-100}
      FX_LOCK_MINUTES: ${FX_LOCK_MINUTES:-30}
      ALGO_VERSION: ${ALGO_VERSION:-net-0.1.0}
      ALLOWED_ORIGINS: '["http://localhost:3010","http://127.0.0.1:3010"]'
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3011:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3010:80"

volumes:
  dbdata:
